<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book a Session — Nikki Beauty Maison</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class=" bg-white">
    <header class="relative top-0  md:px-14 px-7 bg-white/80 backdrop-blur-md border-b border-gray-200 z-50">
      <div class="container header-inner flex items-center justify-between py-3">
        <a class="brand flex items-center gaborder border-black p-3" href="index.html">
          <img src="assets/logo.png" alt="Nikki Beauty Maison logo placeholder" class="h-16 w-auto">
        </a>
        <button class="nav-toggle md:hidden" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav hidden md:flex gap-4 items-center">
          <a class="text-[#000435] hover:text-sky-600 font-[400] text-[13px] px-2 py-1 rounded-md" href="#services">Services</a>
          <a class="text-[#000435] hover:text-sky-600 font-[400] text-[13px] px-2 py-1 rounded-md" href="#about">About</a>
          <a class="text-[#000435] hover:text-sky-600 font-[400] text-[13px] px-2 py-1 rounded-md" href="#">Reviews</a>
          <a class="text-[#000435] hover:text-sky-600 font-[400] text-[13px] px-2 py-1 rounded-md" href="#contact">Contact</a>
          <a class="cta border-[1px] border-[#000435] bg-transparent hover:bg-[#000435] hover:text-white duration-300 [#000435] px-4 font-[400] text-[13px] py-2" href="booking.html">Book Now</a>
        </nav>
      </div>
    </header>

    <main class="reveal py-16">
      <div class=" md:px-28 p-6">
        <div class="flex items-center justify-center mb-5 gap-4">
            <a href="index.html" class="tracking-widest font-bold text-[12px] text-slate-500">HOME </a> / 
            <a href="#" class="tracking-widest font-bold text-[12px] text-slate-500"> BOOK NOW </a>

        </div>
        <h1 class="text-2xl md:text-3xl mb-4 text-center">Book a Makeup Session</h1>
        <p class="text-gray-600 mb-6 text-center">Please fill out the form below and we'll get back to you to confirm availability.</p>

        <form id="bookingForm" class="space-y-4 bg-white p-6  rounded-lg border-black border">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="flex flex-col">
              <span class="text-sm font-medium text-slate-800">Full name*</span>
              <input name="name" required class="mt-1 border border-black p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-300" />
            </label>
            <label class="flex flex-col">
              <span class="text-sm font-medium text-slate-800">Email*</span>
              <input type="email" name="email" required class="mt-1 border border-black p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-300" />
            </label>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="flex flex-col">
              <span class="text-sm font-medium text-slate-800">Phone / WhatsApp*</span>
              <input name="phone" required class="mt-1 border border-black p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-300" />
            </label>
            <label class="flex flex-col">
              <span class="text-sm font-medium text-slate-800">Event type</span>
              <select name="event" class="mt-1 border border-black p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-300">
                <option>Bridal</option>
                <option>Special event / Party</option>
                <option>Traditional</option>
                <option>Other</option>
              </select>
            </label>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="flex flex-col">
              <span class="text-sm font-medium text-slate-800">Preferred date*</span>
              <input type="date" name="date" required class="mt-1 border border-black p-3  rounded-md focus:outline-none focus:ring-2 focus:ring-sky-300" />
            </label>
            <label class="flex flex-col">
              <span class="text-sm font-medium text-slate-800">Preferred time</span>
              <input type="time" name="time" class="mt-1 border border-black p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-300" />
            </label>
          </div>

          <label class="flex flex-col">
            <span class="text-sm font-medium text-slate-800">Details / notes</span>
            <textarea name="message" rows="4" class="mt-1 border border-black p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-300"></textarea>
          </label>

          <div class="flex items-center gap-3 p-3">
            <button type="submit" class="inline-flex items-center px-3 py-2 bg-[#000435] text-white text-sm rounded-md">Request Booking</button>
          </div>

          <div id="formFeedback" class="text-sm text-red-600" role="status" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <footer class="py-8 border-t mx-5">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
          <div class="text-sm text-slate-500 text-center">© <span id="year"></span> Nikki Beauty Maison</div>
          <div class="flex gap-6">
            <a href="https://www.instagram.com/nikkibeautymaison" target="_blank" class="text-slate-600 text-xl hover:text-[#A48111] duration-300" title="Instagram">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://wa.me/447828503409" target="_blank" class="text-slate-600 text-xl hover:text-[#A48111] duration-300" title="WhatsApp">
              <i class="fa-brands fa-whatsapp"></i>
            </a>
          </div>
        </div>
      </div>
    </footer>
    <script src="script.js"></script>
</body> 
</html>
